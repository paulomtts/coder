name: Test

on:
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - run: uv sync --dev

      - name: Run tests
        run: uv run pytest -x -v
