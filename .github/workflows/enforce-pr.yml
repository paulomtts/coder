name: Enforce PR workflow

on:
  push:
    branches: [main, master]

jobs:
  block-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check for associated pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get PRs that contain this commit
          prs=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq 'length')

          if [ "$prs" -eq 0 ]; then
            echo "::error::Direct pushes to ${{ github.ref_name }} are not allowed. Please open a pull request."
            exit 1
          fi

          echo "Commit arrived via pull request. OK."
